<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Basalt — markdown vault</title>
<link rel="stylesheet" href="/vendor/codemirror/codemirror.css">
<link rel="stylesheet" href="/vendor/codemirror/dialog.css">
<link rel="stylesheet" href="/vendor/highlight/github-dark.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header id="topbar">
  <div class="brand">⛰ Basalt</div>
  <button id="btn-new" title="New note (Ctrl+N)">＋ New</button>
  <button id="btn-bold" title="Bold (Ctrl+B)"><b>B</b></button>
  <button id="btn-italic" title="Italic (Ctrl+I)"><i>I</i></button>
  <button id="btn-underline" title="Underline (Ctrl+U)"><u>U</u></button>
  <button id="btn-strike" title="Strikethrough (Ctrl+Shift+X)"><s>S</s></button>
  <button id="btn-table" title="Insert table">Table</button>
  <span class="spacer"></span>
  <button id="btn-import" title="Import markdown or zip">Import</button>
  <button id="btn-export" title="Export vault as .zip">Export</button>
  <button id="btn-wormhole" title="Share vault via wormhole.app">Share</button>
  <input id="import-file" type="file" accept=".md,.zip,text/markdown,application/zip" multiple hidden>
</header>

<main>
  <aside id="sidebar"><ul id="filelist"></ul></aside>
  <section id="split">
    <div id="editor-pane"><textarea id="editor"></textarea></div>
  </section>
</main>

<footer id="statusbar">
  <span id="status">Ready</span>
  <span class="spacer"></span>
  <span id="keymap-label">vim</span>
  <span id="savestate"></span>
</footer>

<div id="wormhole-modal" class="modal hidden">
  <div class="modal-box share-box">
    <h2>Share vault</h2>
    <p id="wormhole-status">Uploading an encrypted copy to wormhole.app…</p>
    <img id="wormhole-qr" class="hidden" alt="QR code for share link">
    <a id="wormhole-link" class="share-link hidden" href="#" target="_blank" rel="noopener"></a>
    <div class="modal-actions">
      <button id="wormhole-share" class="hidden">Share</button>
      <button id="wormhole-copy" class="hidden">Copy link</button>
      <button id="wormhole-cancel">Close</button>
    </div>
  </div>
</div>

<script src="/vendor/codemirror/codemirror.js"></script>
<script src="/vendor/codemirror/mode-markdown.js"></script>
<script src="/vendor/codemirror/mode-javascript.js"></script>
<script src="/vendor/codemirror/mode-xml.js"></script>
<script src="/vendor/codemirror/continuelist.js"></script>
<script src="/vendor/codemirror/closebrackets.js"></script>
<script src="/vendor/codemirror/active-line.js"></script>
<script src="/vendor/codemirror/placeholder.js"></script>
<script src="/vendor/codemirror/dialog.js"></script>
<script src="/vendor/codemirror/searchcursor.js"></script>
<script src="/vendor/codemirror/vim.js"></script>
<script src="/vendor/mermaid/mermaid.min.js"></script>
<script src="/js/fixlists.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
